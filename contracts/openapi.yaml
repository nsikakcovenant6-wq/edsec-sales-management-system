        interval: { $ref: '#/components/schemas/BillingInterval' }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        trial_ends_at: { type: [string, 'null'], format: date-time }
        current_period_end: { type: [string, 'null'], format: date-time }
        grace_ends_at: { type: [string, 'null'], format: date-time }
        features: { type: array, items: { $ref: '#/components/schemas/FeatureEntitlement' } }
    Branch:
