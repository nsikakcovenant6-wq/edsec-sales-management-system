openapi: 3.1.0
info:
  title: EDSEC Sales Management System API
  version: 1.3.0
  description: >
    Backward-compatible contract restoring the v1.1 operation families and
    resolving frontend blockers, including checkout and POS offline sync.
servers:
  - url: https://api.edsecictinstitute.com/api/v1
    description: Proposed production endpoint
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - SupabaseBearer: []
tags:
  - name: Me
  - name: Businesses
  - name: Branches
  - name: Categories
  - name: Onboarding
  - name: Products
  - name: Inventory
  - name: Suppliers
  - name: Purchases
  - name: Sales
  - name: Payments
  - name: Storage
paths:
  /me:
    get:
      tags: [Me]
      summary: Get authenticated profile, memberships, permissions and onboarding state.
      x-permission: authenticated
      responses:
        '200':
          description: Current profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/active-business:
    put:
      tags: [Me]
      summary: Select active business from verified memberships; client stores selection for the session.
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_id]
              properties:
                business_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Selected business.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
  /plans:
    get:
      tags: [Businesses]
      summary: List available subscription plans and prices.
      security: []
      x-permission: public
      responses:
        '200':
          description: Plans and prices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses:
    get:
      tags: [Businesses]
      summary: List businesses for the authenticated member.
      x-permission: authenticated
      responses:
        '200':
          description: Business memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
    post:
      tags: [Businesses]
      summary: Create business, owner membership, default branch and onboarding record.
      x-permission: authenticated; verified_email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCreate'
      responses:
        '201':
          description: Business created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '422':
          $ref: '#/components/responses/ValidationError'
  /businesses/{business_id}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Businesses]
      summary: Get business profile.
      x-permission: business.settings.read
      responses:
        '200':
          description: Business.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Businesses]
      summary: Update business profile, including logo object path.
      x-permission: business.settings.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessUpdate'
      responses:
        '200':
          description: Updated business.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/subscription:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Businesses]
      summary: Get subscription, dates and effective plan entitlements.
      x-permission: subscription.read
      responses:
        '200':
          description: Subscription details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
  /businesses/{business_id}/categories:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    put:
      tags: [Categories]
      summary: Replace one or more business categories.
      x-permission: business.settings.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_ids]
              properties:
                category_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Business categories updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /categories:
    get:
      tags: [Categories]
      summary: Get public global category tree and vertical feature flags.
      security: []
      x-permission: public
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/branches:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Branches]
      summary: List branches visible to caller.
      x-permission: branches.read
      x-feature: multi_branch
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Branch page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
    post:
      tags: [Branches]
      summary: Create branch.
      x-permission: branches.manage
      x-feature: multi_branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchWrite'
      responses:
        '201':
          description: Branch created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/branches/{branch_id}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - name: branch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Branches]
      summary: Update branch or deactivate it.
      x-permission: branches.manage
      x-feature: multi_branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchWrite'
      responses:
        '200':
          description: Branch updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/onboarding:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Onboarding]
      summary: Get persisted onboarding progress.
      x-permission: business.settings.read
      responses:
        '200':
          description: Onboarding progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResponse'
    patch:
      tags: [Onboarding]
      summary: Save current step, completed steps and skipped optional steps.
      x-permission: business.settings.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingPatch'
      responses:
        '200':
          description: Updated onboarding progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResponse'
  /businesses/{business_id}/product-templates:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Products]
      summary: List global templates with category and image licence metadata.
      x-permission: products.read
      x-feature: product_templates
      parameters:
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Template page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
  /businesses/{business_id}/product-templates/{template_id}/copy:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Products]
      summary: Copy global template to tenant products with zero stock.
      x-permission: products.create
      x-feature: product_templates
      responses:
        '201':
          description: Tenant product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/products:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Products]
      summary: List products with category, status and sort filters.
      x-permission: products.read
      parameters:
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived]
        - name: sort
          in: query
          schema:
            type: string
            enum: [name_asc, name_desc, created_desc, updated_desc]
        - name: q
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Product page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
    post:
      tags: [Products]
      summary: Create product. Cost and selling price fields require their dedicated permissions.
      x-permission: products.create
      x-field-permissions:
        selling_price_minor: products.selling_price.update
        cost_price_minor: products.cost_price.update
        opening_stock: inventory.adjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWrite'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
  /businesses/{business_id}/products/{product_id}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Products]
      summary: Get product.
      x-permission: products.read
      responses:
        '200':
          description: Product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
    patch:
      tags: [Products]
      summary: Update product; price fields require independent permissions.
      x-permission: products.update
      x-field-permissions:
        selling_price_minor: products.selling_price.update
        cost_price_minor: products.cost_price.update
        minimum_selling_price_minor: products.selling_price.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWrite'
      responses:
        '200':
          description: Updated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
    delete:
      tags: [Products]
      summary: Archive product; physical deletion is prohibited.
      x-permission: products.archive
      responses:
        '204':
          description: Product archived.
  /businesses/{business_id}/products/imports:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [Products]
      summary: Start CSV or XLSX import using uploaded object_path.
      x-permission: products.import
      x-feature: product_import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_path, file_name]
              properties:
                object_path:
                  type: string
                file_name:
                  type: string
                branch_id:
                  type: string
                  format: uuid
      responses:
        '202':
          description: Import queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /businesses/{business_id}/products/imports/{import_id}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - name: import_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Products]
      summary: Get import status and row validation report.
      x-permission: products.read
      x-feature: product_import
      responses:
        '200':
          description: Import report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/inventory:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Inventory]
      summary: List inventory balances with branch and low-stock filters.
      x-permission: inventory.read
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: low_stock
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Inventory page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
  /businesses/{business_id}/inventory/adjustments:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [Inventory]
      summary: Record audited stock adjustment.
      x-permission: inventory.adjust
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, product_id, quantity_delta, reason]
              properties:
                branch_id:
                  type: string
                  format: uuid
                product_id:
                  type: string
                  format: uuid
                quantity_delta:
                  type: string
                  pattern: '^-?[0-9]+(\.[0-9]{1,4})?$'
                reason:
                  type: string
                  minLength: 3
      responses:
        '201':
          description: Adjustment recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/inventory/movements:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Inventory]
      summary: List immutable stock movements.
      x-permission: inventory.read
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: product_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Movement page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
  /businesses/{business_id}/suppliers:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Suppliers]
      summary: List suppliers.
      x-permission: suppliers.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Supplier page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
    post:
      tags: [Suppliers]
      summary: Create supplier.
      x-permission: suppliers.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierWrite'
      responses:
        '201':
          description: Supplier created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/purchases:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Purchases]
      summary: List purchase orders.
      x-permission: purchases.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Purchase page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
    post:
      tags: [Purchases]
      summary: Create purchase order.
      x-permission: purchases.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderWrite'
      responses:
        '201':
          description: Purchase order created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/purchases/{purchase_id}/receive:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - name: purchase_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Purchases]
      summary: Receive all or part of a purchase order; update stock atomically.
      x-permission: purchases.receive
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [purchase_line_id, quantity_received]
                    properties:
                      purchase_line_id:
                        type: string
                        format: uuid
                      quantity_received:
                        type: string
                        pattern: '^[0-9]+(\.[0-9]{1,4})?$'
      responses:
        '200':
          description: Purchase received and inventory updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/sales:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Sales]
      summary: List sales.
      x-permission: sales.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sales page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
    post:
      tags: [Sales]
      summary: Create sale with atomic stock deduction and embedded payment intents.
      x-permission: sales.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCreate'
      responses:
        '201':
          description: Sale and embedded tender results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /businesses/{business_id}/sales/{sale_id}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - name: sale_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Sales]
      summary: Get sale with line items and payment records.
      x-permission: sales.read
      responses:
        '200':
          description: Sale details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/sales/{sale_id}/void:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - name: sale_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Sales]
      summary: Void eligible sale with reason and stock reversal; never delete.
      x-permission: sales.void
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: Sale voided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/sales/{sale_id}/refunds:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - name: sale_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Sales]
      summary: Create full or partial refund.
      x-permission: sales.refund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor, reason]
              properties:
                amount_minor:
                  $ref: '#/components/schemas/MoneyMinor'
                reason:
                  type: string
                  minLength: 3
      responses:
        '201':
          description: Refund created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/payments:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Payments]
      summary: List payments with filters.
      x-permission: payments.read
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, failed, reversed]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Payment page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
    post:
      tags: [Payments]
      summary: Record a later/manual tender against an existing sale.
      x-permission: payments.record
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '201':
          description: Payment recorded or provider initiation pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/payments/{payment_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Payments]
      summary: Confirm manual bank transfer with evidence reference.
      x-permission: payments.confirm_manual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_reference]
              properties:
                provider_reference:
                  type: string
                evidence_object_path:
                  type: [string, 'null']
      responses:
        '200':
          description: Payment confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /businesses/{business_id}/storage/upload-url:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [Storage]
      summary: Create short-lived signed Supabase upload URL; permission depends on purpose.
      x-permission: purpose-dependent:business.settings.update|products.create|products.update|products.import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '201':
          description: Signed upload URL, object path and expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /businesses/{business_id}/sync/batches:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [Sales]
      summary: Submit up to 50 offline POS operations; return independent operation outcomes.
      x-permission: sales.sync
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatch'
      responses:
        '200':
          description: Per-operation accepted or rejected results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /businesses/{business_id}/sync/status:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Sales]
      summary: Get sync cursor and registered device status.
      x-permission: sales.sync
      responses:
        '200':
          description: Sync status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /webhooks/paystack:
    post:
      tags: [Payments]
      summary: Verify Paystack signature and transaction server-side.
      security: []
      x-permission: provider_signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Verified webhook acknowledged.
        '400':
          description: Invalid signature or malformed payload.
components:
  securitySchemes:
    SupabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BusinessId:
      name: business_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Success:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          additionalProperties: true
    PageMeta:
      type: object
      properties:
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
    PageResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          properties:
            meta:
              $ref: '#/components/schemas/PageMeta'
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            request_id:
              type: string
              format: uuid
            fields:
              type: object
              additionalProperties:
                type: string
    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_ERROR
        - CONFLICT
        - RATE_LIMITED
        - SUBSCRIPTION_INACTIVE
        - PLAN_FEATURE_UNAVAILABLE
        - PLAN_LIMIT_EXCEEDED
        - PAYMENT_REQUIRED
        - STOCK_INSUFFICIENT
        - INSUFFICIENT_STOCK
        - PRICE_CHANGED
        - PRODUCT_ARCHIVED
        - IDEMPOTENCY_KEY_REUSED
        - EMAIL_NOT_VERIFIED
        - PAYMENT_UNVERIFIED
        - TENANT_CONTEXT_REQUIRED
        - SYNC_BATCH_TOO_LARGE
        - DISCOUNT_BELOW_COST
        - PAYLOAD_TOO_LARGE
        - INTERNAL_ERROR
    PermissionKey:
      type: string
      enum:
        - business.settings.read
        - business.settings.update
        - members.read
        - members.invite
        - members.update
        - members.remove
        - roles.read
        - roles.manage
        - dashboard.read
        - notifications.read
        - notifications.manage
        - products.read
        - products.create
        - products.update
        - products.archive
        - products.import
        - products.cost_price.view
        - products.cost_price.update
        - products.selling_price.update
        - inventory.read
        - inventory.adjust
        - inventory.transfer
        - inventory.receive
        - suppliers.read
        - suppliers.create
        - suppliers.update
        - purchases.read
        - purchases.create
        - purchases.receive
        - purchases.cancel
        - sales.read
        - sales.create
        - sales.void
        - sales.refund
        - sales.sync
        - discounts.read
        - discounts.create
        - discounts.approve
        - discount.override_below_cost
        - payments.read
        - payments.record
        - payments.confirm_manual
        - payments.refund
        - customers.read
        - customers.create
        - customers.update
        - customers.export
        - customers.anonymise
        - credit.read
        - credit.issue
        - credit.collect
        - credit.adjust
        - expenses.read
        - expenses.create
        - expenses.approve
        - reports.sales.read
        - reports.finance.read
        - reports.inventory.read
        - reports.export
        - branches.read
        - branches.manage
        - cash_sessions.read
        - cash_sessions.manage
        - quotations.read
        - quotations.manage
        - invoices.read
        - invoices.manage
        - subscription.read
        - subscription.manage
        - audit.read
        - ai.analytics.use
        - ai.reports.configure
        - platform.businesses.manage
        - platform.plans.manage
        - platform.templates.manage
        - platform.images.manage
        - platform.payments.read
        - platform.support.manage
        - platform.audit.read
    MoneyMinor:
      type: string
      pattern: '^[0-9]+$'
      description: Unsigned integer minor units encoded as a base-10 string.
      examples: ['125000']
    SignedMoneyMinor:
      type: string
      pattern: '^-?[0-9]+$'
      description: Signed integer minor-unit delta.
      examples: ['-2500']
    Quantity:
      type: string
      pattern: '^[0-9]+(\.[0-9]{1,4})?$'
      description: Non-negative quantity, maximum four decimal places (Decimal(18,4)).
    SignedQuantity:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,4})?$'
      description: Signed quantity delta, maximum four decimal places (Decimal(18,4)).
    BusinessCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        address:
          type: [string, 'null']
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
          default: NGN
        timezone:
          type: string
          default: Africa/Lagos
        vat_enabled:
          type: boolean
          default: false
        vat_rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
          default: 750
    BusinessUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        address:
          type: [string, 'null']
        logo_object_path:
          type: [string, 'null']
        currency_code:
          type: string
        timezone:
          type: string
        vat_enabled:
          type: boolean
        vat_rate_bps:
          type: integer
        tax_mode:
          type: string
          enum: [inclusive, exclusive]
    MeResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          properties:
            data:
              type: object
              required: [user_id, email, memberships]
              properties:
                user_id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                full_name:
                  type: [string, 'null']
                memberships:
                  type: array
                  items:
                    type: object
                    required: [business_id, role, permissions, permission_scopes, branch_ids, default_branch_id, subscription_status, features, onboarding]
                    properties:
                      business_id:
                        type: string
                        format: uuid
                      business_name:
                        type: string
                      role:
                        type: string
                      permissions:
                        type: array
                        items:
                          $ref: '#/components/schemas/PermissionKey'
                      permission_scopes:
                        type: object
                        additionalProperties:
                          type: string
                          enum: [business, assigned_branches, own_records, business_or_own]
                      branch_ids:
                        type: array
                        items:
                          type: string
                          format: uuid
                      default_branch_id:
                        type: [string, 'null']
                        format: uuid
                      subscription_status:
                        $ref: '#/components/schemas/SubscriptionStatus'
                      features:
                        type: array
                        items:
                          $ref: '#/components/schemas/FeatureEntitlement'
                      onboarding:
                        $ref: '#/components/schemas/OnboardingProgress'
    SubscriptionStatus:
      type: string
      enum: [trial, active, grace, expired]
    BillingInterval:
      type: string
      enum: [monthly, quarterly, annually, custom]
    FeatureEntitlement:
      type: object
      required: [key, enabled, limit, usage]
      properties:
        key:
          type: string
        enabled:
          type: boolean
        limit:
          type: [integer, 'null']
        usage:
          type: integer
    SubscriptionResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          properties:
            data:
              type: object
              required: [plan, interval, status, trial_ends_at, current_period_end, grace_ends_at, features]
              properties:
                plan:
                  type: object
                  required: [code, name]
                  properties:
                    code:
                      type: string
                    name:
                      type: string
                interval:
                  $ref: '#/components/schemas/BillingInterval'
                status:
                  $ref: '#/components/schemas/SubscriptionStatus'
                trial_ends_at:
                  type: [string, 'null']
                  format: date-time
                current_period_end:
                  type: [string, 'null']
                  format: date-time
                grace_ends_at:
                  type: [string, 'null']
                  format: date-time
                features:
                  type: array
                  items:
                    $ref: '#/components/schemas/FeatureEntitlement'
    BranchWrite:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
        code:
          type: string
        address:
          type: [string, 'null']
        is_active:
          type: boolean
        is_default:
          type: boolean
    OnboardingStep:
      type: string
      enum: [business_profile, business_category, branch_setup, store_configuration, product_templates, product_import, subscription_selection, team_invitation, onboarding_complete]
    OnboardingProgress:
      type: object
      required: [current_step, completed_steps, skipped_steps, status]
      properties:
        current_step:
          $ref: '#/components/schemas/OnboardingStep'
        completed_steps:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingStep'
        skipped_steps:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingStep'
        status:
          type: string
          enum: [not_started, in_progress, completed]
    OnboardingResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OnboardingProgress'
    OnboardingPatch:
      type: object
      properties:
        current_step:
          $ref: '#/components/schemas/OnboardingStep'
        completed_steps:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingStep'
        skipped_steps:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingStep'
    ProductWrite:
      type: object
      required: [name, selling_price_minor]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: [string, 'null']
        sku:
          type: [string, 'null']
        barcode:
          type: [string, 'null']
        category_id:
          type: [string, 'null']
          format: uuid
        brand_id:
          type: [string, 'null']
          format: uuid
        tracking_type:
          type: string
          enum: [quantity, serial, batch, weighted]
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
        branch_id:
          type: [string, 'null']
          format: uuid
        opening_stock:
          oneOf:
            - $ref: '#/components/schemas/Quantity'
            - type: 'null'
        attributes:
          type: object
          additionalProperties: true
        selling_price_minor:
          $ref: '#/components/schemas/MoneyMinor'
        cost_price_minor:
          $ref: '#/components/schemas/MoneyMinor'
        minimum_selling_price_minor:
          $ref: '#/components/schemas/MoneyMinor'
        image_object_path:
          type: [string, 'null']
    Product:
      type: object
      required: [id, name, status, tracking_type, selling_price_minor, currency_code]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, archived]
        tracking_type:
          type: string
          enum: [quantity, serial, batch, weighted]
        category_id:
          type: [string, 'null']
          format: uuid
        brand_id:
          type: [string, 'null']
          format: uuid
        sku:
          type: [string, 'null']
        barcode:
          type: [string, 'null']
        selling_price_minor:
          $ref: '#/components/schemas/MoneyMinor'
        cost_price_minor:
          $ref: '#/components/schemas/MoneyMinor'
        minimum_selling_price_minor:
          $ref: '#/components/schemas/MoneyMinor'
        currency_code:
          type: string
        image_url:
          type: [string, 'null']
          format: uri
    InventoryBalance:
      type: object
      required: [product_id, branch_id, quantity_on_hand, quantity_reserved, quantity_available]
      properties:
        product_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        quantity_on_hand:
          $ref: '#/components/schemas/SignedQuantity'
        quantity_reserved:
          $ref: '#/components/schemas/Quantity'
        quantity_available:
          $ref: '#/components/schemas/SignedQuantity'
        stock_value_minor:
          $ref: '#/components/schemas/MoneyMinor'
    StockMovement:
      type: object
      required: [id, product_id, branch_id, movement_type, quantity_delta, created_at]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        movement_type:
          type: string
        quantity_delta:
          $ref: '#/components/schemas/SignedQuantity'
        reference:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    SupplierWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
        email:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        address:
          type: [string, 'null']
    PurchaseOrderWrite:
      type: object
      required: [branch_id, supplier_id, lines]
      properties:
        branch_id:
          type: string
          format: uuid
        supplier_id:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity, unit_cost_minor]
            properties:
              product_id:
                type: string
                format: uuid
              quantity:
                $ref: '#/components/schemas/Quantity'
              unit_cost_minor:
                $ref: '#/components/schemas/MoneyMinor'
    SaleCreate:
      type: object
      required: [branch_id, items, tenders]
      properties:
        branch_id:
          type: string
          format: uuid
        customer_id:
          type: [string, 'null']
          format: uuid
        client_created_at:
          type: [string, 'null']
          format: date-time
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id:
                type: string
                format: uuid
              variant_id:
                type: [string, 'null']
                format: uuid
              quantity:
                $ref: '#/components/schemas/Quantity'
              unit_price_minor:
                $ref: '#/components/schemas/MoneyMinor'
                description: Client catalogue snapshot only; server recalculates and rejects PRICE_CHANGED rather than trusting this value.
              discount_minor:
                $ref: '#/components/schemas/MoneyMinor'
        discount_minor:
          $ref: '#/components/schemas/MoneyMinor'
        tenders:
          type: array
          items:
            type: object
            required: [method, amount_minor]
            properties:
              method:
                type: string
                enum: [cash, bank_transfer, card_terminal, paystack, customer_credit]
              amount_minor:
                $ref: '#/components/schemas/MoneyMinor'
              provider_reference:
                type: [string, 'null']
    PaymentCreate:
      type: object
      required: [sale_id, method, amount_minor]
      properties:
        sale_id:
          type: string
          format: uuid
        method:
          type: string
          enum: [cash, bank_transfer, card, paystack, customer_credit]
        amount_minor:
          $ref: '#/components/schemas/MoneyMinor'
        provider_reference:
          type: [string, 'null']
    UploadUrlRequest:
      type: object
      description: After receiving upload_url, client sends raw file bytes using HTTP PUT to that URL. Do not use supabase-js uploadToSignedUrl for this contract.
      required: [purpose, file_name, content_type, size_bytes]
      properties:
        purpose:
          type: string
          enum: [business_logo, product_image, import_file]
        file_name:
          type: string
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
        size_bytes:
          type: integer
          minimum: 1
          maximum: 10485760
    UploadUrlResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          properties:
            data:
              type: object
              required: [upload_url, object_path, expires_at]
              properties:
                upload_url:
                  type: string
                  format: uri
                object_path:
                  type: string
                expires_at:
                  type: string
                  format: date-time
    SyncBatch:
      type: object
      required: [device_id, operations]
      properties:
        device_id:
          type: string
          format: uuid
        operations:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [client_operation_id, client_created_at, sale]
            properties:
              client_operation_id:
                type: string
                format: uuid
              client_created_at:
                type: string
                format: date-time
              sale:
                $ref: '#/components/schemas/SaleCreate'
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Authenticated but not authorised.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: State or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PaymentRequired:
      description: Payment required or subscription inactive.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: Request payload exceeds permitted size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
