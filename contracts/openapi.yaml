        skipped_steps: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/OnboardingStep' } }
        status: { type: string, enum: [not_started, in_progress, completed] }
        updated_at: { type: string, format: date-time }
    OnboardingPatch:
      type: object
      properties:
