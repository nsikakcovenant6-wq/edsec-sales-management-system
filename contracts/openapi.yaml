openapi: 3.1.0
info:
  title: EDSEC Sales Management System API
  version: 1.3.0
  description: >
    Contract revision restoring v1.1 operations and resolving frontend blockers, POS and offline sync requirements. PostgreSQL is the
    source of truth. Tenant context is derived from a verified Supabase JWT
    and validated membership. All non-POS operations are online-only.
servers:
  - url: https://api.edsecictinstitute.com/api/v1
    description: Proposed production URL
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - SupabaseBearer: []
tags:
  - { name: Me }
  - { name: Businesses }
  - { name: Branches }
  - { name: Categories }
  - { name: Onboarding }
  - { name: Products }
  - { name: Inventory }
  - { name: Suppliers }
  - { name: Purchases }
  - { name: Sales }
  - { name: Payments }
  - { name: Storage }
paths:
  /me:
    get:
      tags: [Me]
      summary: Current profile, memberships, permissions, scopes and entitlements summary.
      responses:
        '200':
          description: Current authenticated user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MeProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /businesses:
    get:
      tags: [Businesses]
      summary: List businesses the caller is an active member of.
      responses:
        '200':
          description: Business memberships.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BusinessListItem' }
    post:
      tags: [Businesses]
      summary: Create business, owner membership, default branch and onboarding record atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessCreate' }
      responses:
        '201':
          description: Created business and default branch.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Business' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /businesses/{business_id}/subscription:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Businesses]
      summary: Current subscription and effective feature entitlements.
      responses:
        '200':
          description: Subscription.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Subscription' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /businesses/{business_id}/branches:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Branches]
      summary: List branches visible to the caller.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Branches.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Branch' }
    post:
      tags: [Branches]
      summary: Create a branch.
      x-permission: branches.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchWrite' }
      responses:
        '201':
          description: Branch created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Branch' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /businesses/{business_id}/branches/{branch_id}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - name: branch_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Branches]
      summary: Update branch details or default status.
      x-permission: branches.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchWrite' }
      responses:
        '200':
          description: Updated branch.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Branch' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /categories:
    get:
      tags: [Categories]
      security: []
      summary: Global category tree and vertical feature flags.
      responses:
        '200':
          description: Category tree.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CategoryNode' }
  /businesses/{business_id}/onboarding:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Onboarding]
      summary: Read persisted onboarding progress.
      responses:
        '200':
          description: Progress.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OnboardingProgress' }
    patch:
      tags: [Onboarding]
      summary: Update current step, completed and skipped steps.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingPatch' }
      responses:
        '200':
          description: Updated progress.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OnboardingProgress' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /businesses/{business_id}/products:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Products]
      summary: List products.
      parameters:
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
        - { name: sort, in: query, schema: { type: string, enum: [name_asc, name_desc, created_desc, updated_desc] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Product page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [Products]
      summary: Create product.
      x-permission: products.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductWrite' }
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /businesses/{business_id}/inventory:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Inventory]
      summary: Inventory balances visible to caller.
      parameters:
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: low_stock, in: query, schema: { type: boolean } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Inventory balance list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/InventoryBalance' }
  /businesses/{business_id}/suppliers:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Suppliers]
      summary: List suppliers.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Supplier list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Supplier' }
    post:
      tags: [Suppliers]
      summary: Create supplier.
      x-permission: suppliers.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierWrite' }
      responses:
        '201':
          description: Supplier created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Supplier' }
  /businesses/{business_id}/purchases:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Purchases]
      summary: List purchase orders.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Purchase orders.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PurchaseOrder' }
    post:
      summary: Create a purchase order.
      x-permission: purchases.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderWrite' }
      responses:
        '201': { description: Purchase created, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }

  /businesses/{business_id}/sales:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Sales]
      summary: List sales.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Sales.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Sale' }
    post:
      summary: Create sale with atomic stock deduction and embedded tender intents.
      x-permission: sales.create
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleCreate' }
      responses:
        '201': { description: Sale and payment intents, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /businesses/{business_id}/payments:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [Payments]
      summary: Record a payment or initiate Paystack checkout.
      x-permission: payments.record
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCreate' }
      responses:
        '201':
          description: Payment recorded or pending provider initiation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PaymentInitiationResult' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      summary: List payments with filters.
      x-permission: payments.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, confirmed, failed, reversed] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Payment page, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }

  /businesses/{business_id}/storage/upload-url:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [Storage]
      summary: Create a short-lived signed upload URL for tenant-owned media.
      x-permission: purpose-dependent:business.settings.update|products.create|products.update|products.import
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadUrlRequest' }
      responses:
        '201':
          description: Signed upload URL and object metadata.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UploadUrlResult' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /plans:
    get:
      summary: List active subscription plans and prices.
      security: []
      x-permission: public
      responses:
        '200': { description: Plans, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /businesses/{business_id}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      summary: Get business profile.
      x-permission: business.settings.read
      responses:
        '200': { description: Business, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
    patch:
      summary: Update business profile and logo object path.
      x-permission: business.settings.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, logo_object_path: { type: [string, 'null'] }, email: { type: [string, 'null'] }, phone: { type: [string, 'null'] }, address: { type: [string, 'null'] }, currency_code: { type: string }, timezone: { type: string }, vat_enabled: { type: boolean }, vat_rate_bps: { type: integer }, tax_mode: { type: string, enum: [inclusive, exclusive] } } }
      responses:
        '200': { description: Updated business, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /businesses/{business_id}/categories:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    put:
      summary: Replace one or more business categories.
      x-permission: business.settings.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [category_ids], properties: { category_ids: { type: array, minItems: 1, uniqueItems: true, items: { type: string, format: uuid } } } }
      responses:
        '200': { description: Categories updated, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /businesses/{business_id}/product-templates:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      summary: List global product templates with image licence metadata.
      x-permission: products.read
      x-feature: product_templates
      parameters:
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Templates, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /businesses/{business_id}/product-templates/{template_id}/copy:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: template_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Copy template to tenant products with zero stock.
      x-permission: products.create
      x-feature: product_templates
      responses:
        '201': { description: Product copied, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /businesses/{business_id}/products/{product_id}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: product_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get product.
      x-permission: products.read
      responses:
        '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
    patch:
      summary: Update product; price fields require independent price permissions.
      x-permission: products.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductWrite' }
      responses:
        '200': { description: Updated product, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
    delete:
      summary: Archive product; hard delete prohibited.
      x-permission: products.archive
      responses:
        '204': { description: Archived }
  /businesses/{business_id}/products/imports:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      summary: Start CSV/XLSX product import by uploaded object_path.
      x-permission: products.import
      x-feature: product_import
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [object_path, file_name], properties: { object_path: { type: string }, file_name: { type: string }, branch_id: { type: string, format: uuid } } }
      responses:
        '202': { description: Import queued, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /businesses/{business_id}/products/imports/{import_id}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: import_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get import status and row report.
      x-permission: products.read
      x-feature: product_import
      responses:
        '200': { description: Import report, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /businesses/{business_id}/inventory/adjustments:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      summary: Create audited stock adjustment.
      x-permission: inventory.adjust
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [branch_id, product_id, quantity_delta, reason], properties: { branch_id: { type: string, format: uuid }, product_id: { type: string, format: uuid }, quantity_delta: { type: string, pattern: '^-?[0-9]+(\\.[0-9]{1,4})?$' }, reason: { type: string } } }
      responses:
        '201': { description: Adjustment recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /businesses/{business_id}/inventory/movements:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      summary: List stock movements.
      x-permission: inventory.read
      parameters:
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Movement page, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /businesses/{business_id}/purchases/{purchase_id}/receive:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: purchase_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Receive purchase order lines and update stock.
      x-permission: purchases.receive
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [lines], properties: { lines: { type: array, items: { type: object, required: [purchase_line_id, quantity_received], properties: { purchase_line_id: { type: string, format: uuid }, quantity_received: { type: string, pattern: '^[0-9]+(\\.[0-9]{1,4})?$' } } } } } }
      responses:
        '200': { description: Received, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /businesses/{business_id}/sales/{sale_id}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: sale_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get sale, items and payment records.
      x-permission: sales.read
      responses:
        '200': { description: Sale, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /businesses/{business_id}/sales/{sale_id}/void:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: sale_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Void sale with reason; never delete.
      x-permission: sales.void
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 } } }
      responses:
        '200': { description: Sale voided, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /businesses/{business_id}/sales/{sale_id}/refunds:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: sale_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Create partial or full sale refund.
      x-permission: sales.refund
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount_minor, reason], properties: { amount_minor: { $ref: '#/components/schemas/MoneyMinor' }, reason: { type: string } } }
      responses:
        '201': { description: Refund created, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /businesses/{business_id}/payments/{payment_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: payment_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Confirm manual bank transfer.
      x-permission: payments.confirm_manual
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [provider_reference], properties: { provider_reference: { type: string }, evidence_object_path: { type: [string, 'null'] } } }
      responses:
        '200': { description: Payment confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /businesses/{business_id}/sync/batches:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      summary: Sync bounded offline POS batch with per-operation results.
      x-permission: sales.sync
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [device_id, operations], properties: { device_id: { type: string, format: uuid }, operations: { type: array, minItems: 1, maxItems: 50, items: { type: object, required: [client_operation_id, client_created_at, sale], properties: { client_operation_id: { type: string, format: uuid }, client_created_at: { type: string, format: date-time }, sale: { $ref: '#/components/schemas/SaleCreate' } } } } } }
      responses:
        '200': { description: Accepted/rejected operations, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /businesses/{business_id}/sync/status:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      summary: Read offline sync device status.
      x-permission: sales.sync
      responses:
        '200': { description: Sync status, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /me/active-business:
    put:
      summary: Select active business from verified memberships; client retains session selection.
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [business_id], properties: { business_id: { type: string, format: uuid } } }
      responses:
        '200': { description: Active business, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /webhooks/paystack:
    post:
      summary: Verify Paystack signature and transaction server-side.
      security: []
      x-permission: provider_signature
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Verified webhook acknowledged. }
        '400': { description: Invalid signature or payload. }
components:
  securitySchemes:
    SupabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BusinessId:
      name: business_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Success:
      type: object
      required: [data]
      properties:
        data: {}
        meta: { type: object, additionalProperties: true }
    PageMeta:
      type: object
      properties:
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            request_id: { type: string, format: uuid }
            fields: { type: object, additionalProperties: { type: string } }
    ErrorCode:
      type: string
      enum: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VALIDATION_ERROR, CONFLICT, RATE_LIMITED, SUBSCRIPTION_INACTIVE, PLAN_FEATURE_UNAVAILABLE, PLAN_LIMIT_EXCEEDED, PAYMENT_REQUIRED, STOCK_INSUFFICIENT, INSUFFICIENT_STOCK, PRICE_CHANGED, PRODUCT_ARCHIVED, IDEMPOTENCY_KEY_REUSED, EMAIL_NOT_VERIFIED, PAYMENT_UNVERIFIED, TENANT_CONTEXT_REQUIRED, SYNC_BATCH_TOO_LARGE, DISCOUNT_BELOW_COST, INTERNAL_ERROR]
    MoneyMinor:
      type: string
      pattern: '^[0-9]+$'
      description: Unsigned integer minor units as decimal string.
      examples: ['125000']
    SignedMoneyMinor:
      type: string
      pattern: '^-?[0-9]+$'
      description: Signed integer minor-unit delta.
      examples: ['-2500']
    MeProfile:
      type: object
      required: [user_id, email, memberships]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        memberships:
          type: array
          items:
            type: object
            required: [business_id, role, permissions, permission_scopes, branch_ids, default_branch_id, subscription_status, features]
            properties:
              business_id: { type: string, format: uuid }
              business_name: { type: string }
              role: { type: string }
              permissions: { type: array, items: { type: string } }
              permission_scopes: { type: object, additionalProperties: { type: string, enum: [business, assigned_branches, own_records, business_or_own] } }
              branch_ids: { type: array, items: { type: string, format: uuid } }
              default_branch_id: { type: [string, 'null'], format: uuid }
              subscription_status: { $ref: '#/components/schemas/SubscriptionStatus' }
              features: { type: array, items: { $ref: '#/components/schemas/FeatureEntitlement' } }
    BusinessListItem:
      type: object
      required: [id, name, currency_code, timezone, logo_url, default_branch_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        timezone: { type: string }
        logo_url: { type: [string, 'null'], format: uri }
        default_branch_id: { type: string, format: uuid }
    BusinessCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        category_id: { type: [string, 'null'], format: uuid }
        currency_code: { type: string, default: NGN }
        timezone: { type: string, default: Africa/Lagos }
        vat_enabled: { type: boolean, default: false }
        vat_rate_bps: { type: integer, minimum: 0, maximum: 10000, default: 750 }
    Business:
      allOf:
        - $ref: '#/components/schemas/BusinessListItem'
        - type: object
          properties:
            email: { type: [string, 'null'], format: email }
            phone: { type: [string, 'null'] }
            address: { type: [string, 'null'] }
            vat_enabled: { type: boolean }
            vat_rate_bps: { type: integer }
    SubscriptionStatus:
      type: string
      enum: [trial, active, grace, expired]
    BillingInterval:
      type: string
      enum: [monthly, quarterly, annually, custom]
    Plan:
      type: object
      required: [code, name, description]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
    PlanPrice:
      type: object
      required: [interval, amount_minor, currency_code]
      properties:
        interval: { $ref: '#/components/schemas/BillingInterval' }
        amount_minor: { $ref: '#/components/schemas/MoneyMinor' }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
    PlanFeature:
      type: object
      required: [key, enabled, limit, usage]
      properties:
        key: { type: string }
        enabled: { type: boolean }
        limit: { type: [integer, 'null'], minimum: 0 }
        usage: { type: integer, minimum: 0 }
    FeatureEntitlement:
      $ref: '#/components/schemas/PlanFeature'
    Subscription:
      type: object
      required: [plan, interval, status, trial_ends_at, current_period_end, grace_ends_at, features]
      properties:
