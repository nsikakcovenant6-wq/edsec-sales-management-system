name: Backend foundation CI

on:
  pull_request:
    branches: [backend/main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-foundation-ci.yml"
  push:
    branches: [backend/phase-0-foundation, backend/phase-0-foundation-runtime]
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Backend core typecheck and unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edsec_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edsec_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/edsec_ci?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify canonical schema mirror
        run: cmp ../prisma/schema.prisma prisma/schema.prisma
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Generate and apply schema migration in CI PostgreSQL
        run: |
          npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > /tmp/edsec-schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/edsec-schema.sql
      - name: Apply tenant RLS policies
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/tenant-rls.sql
      - name: Test cross-tenant RLS isolation
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/tenant-rls-smoke.sql
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
