name: Backend foundation CI

on:
  pull_request:
    branches: [backend/main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-foundation-ci.yml"
  push:
    branches: [backend/phase-0-foundation, backend/phase-0-foundation-runtime]
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Backend core typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
